[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reviewer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["python-docx>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["ai_reviewer", "ai_reviewer.splitter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
